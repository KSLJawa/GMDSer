<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="630" viewBox="0 0 1280 630"><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;fill:#172c3c} .muted{fill:#5d7080} .small{font-size:19px}</style><rect width="100%" height="100%" fill="#f4f7f9"/><text x="56" y="70" font-size="36" font-weight="700">同样损失 30 万，下一局的压力相同吗？</text><text x="56" y="112" font-size="20" class="muted">假设示例 · 只比较损失占可支配资产的比例，不推定真实用户心理或行为</text><rect x="56" y="160" width="556" height="340" rx="18" fill="#fff" stroke="#d6e1e6"/><text x="86" y="208" font-size="25" font-weight="600">可支配资产 50 万</text><text x="86" y="290" font-size="58" font-weight="700" style="fill:#c55b38">60%</text><text x="86" y="326" font-size="20" class="muted">本次损失占比</text><rect x="86" y="356" width="496" height="24" rx="4" fill="#e7eef2"/><rect x="86" y="356" width="297.59999999999997" height="24" rx="2" fill="#c55b38"/><text x="86" y="423" font-size="23" >损失后剩余 20 万</text><text x="86" y="465" font-size="18" class="muted">比例条使用相同的 0—100% 范围</text><rect x="668" y="160" width="556" height="340" rx="18" fill="#fff" stroke="#d6e1e6"/><text x="698" y="208" font-size="25" font-weight="600">可支配资产 5000 万</text><text x="698" y="290" font-size="58" font-weight="700" style="fill:#197d83">0.6%</text><text x="698" y="326" font-size="20" class="muted">本次损失占比</text><rect x="698" y="356" width="496" height="24" rx="4" fill="#e7eef2"/><rect x="698" y="356" width="2.976" height="24" rx="2" fill="#197d83"/><text x="698" y="423" font-size="23" >损失后剩余 4970 万</text><text x="698" y="465" font-size="18" class="muted">比例条使用相同的 0—100% 范围</text><text x="56" y="553" font-size="21" >策划观察：还要结合仓库战备、装备券、入场要求与恢复耗时，判断能否继续行动。</text><text x="56" y="594" font-size="18" class="muted">A01｜个人分析图，非游戏截图、非实测玩家分布。数据与计算见配套 JSON。</text></svg>